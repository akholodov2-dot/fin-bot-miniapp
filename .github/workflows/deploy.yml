name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_DIR: /opt/finbot
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${COMMIT_SHA::12}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=accept-new"
          sshpass -e scp $SSH_OPTS deploy/docker-compose.yml "$SSH_TARGET:$DEPLOY_DIR/docker-compose.yml"
          echo "$GHCR_TOKEN" | sshpass -e ssh $SSH_OPTS "$SSH_TARGET" docker login ghcr.io -u "$GHCR_USER" --password-stdin
          sshpass -e ssh $SSH_OPTS "$SSH_TARGET" bash -s <<EOF
          set -e
          cd $DEPLOY_DIR
          echo "FINBOT_IMAGE=$IMAGE" > .env
          docker compose pull
          docker logout ghcr.io
          docker compose up -d --wait --wait-timeout 120
          docker images --format '{{.Repository}}:{{.Tag}}' ${IMAGE%:*} | grep -vx $IMAGE | xargs -r docker rmi || true
          EOF
